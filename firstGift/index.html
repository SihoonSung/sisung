<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FirstGift</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 네비게이션 바 -->
    <nav class="navbar">
        <h1>I love You Eve</h1>
        <input type="text" placeholder="Search...">
        <div class="nav-icons">
            <span>🏠</span>
            <span>💬</span>
            <span>❤️</span>
            <span>👤</span>
        </div>
    </nav>

    <!-- 메인 컨테이너 -->
    <div class="container">
        <!-- 피드 -->
        <div class="feed">
            <div class="post">
                <div class="post-header">
                    <img src="profile.jpg" alt="Profile">
                    <span>@username</span>
                </div>
                <img src="post-image.jpg" alt="Post Image" class="post-img">
                <div class="post-actions">
                    ❤️ 💬 🔄
                </div>
                <p><b>@username</b> This is a caption for the post.</p>
            </div>
        </div>

        <!-- 사이드바 -->
        <div class="sidebar">
            <h3>Recommended</h3>
            <p>@friend1</p>
            <p>@friend2</p>
            <p>@friend3</p>
        </div>
    </div>
</body>
</html>
